<section class="module-panel fw">
  <h2>Editor de Reglas de Firewall</h2>
  <p>
    Listado de políticas activas para permitir o bloquear tráfico. Las reglas se
    evalúan de arriba hacia abajo y gana la primera que coincide.
  </p>

  <div id="fw-stats" class="fw-stats"></div>

  <div class="fw-toolbar">
    <div class="fw-filters" role="group" aria-label="Filtrar por acción">
      <button type="button" class="fw-chip active" data-filter="ALL">Todas</button>
      <button type="button" class="fw-chip" data-filter="ALLOW">ALLOW</button>
      <button type="button" class="fw-chip" data-filter="DENY">DENY</button>
    </div>
    <input id="fw-search" type="search" placeholder="Buscar protocolo, puerto u origen" autocomplete="off" />
  </div>

  <ul id="firewall-rules" class="rules-list"></ul>
</section>
